# Package manifest for the core library.
# Comparison: a .csproj, or a Maven module's pom.xml, or a package.json.

[package]
# The package name. Hyphens are the convention here; in Rust code the same
# crate is referred to with underscores: `arx_core`.
name = "arx-core"

# Inherited from [workspace.package] in the root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# There is no setting that says "this is a library". Cargo decides by file
# name: a package with `src/lib.rs` is a library, one with `src/main.rs` is a
# binary. A package can have both.

# Apply the lints defined in [workspace.lints] in the root Cargo.toml.
[lints]
workspace = true

[dependencies]
# Empty on purpose. Every dependency of this crate is part of the security
# surface, so each one gets added deliberately, with a reason, in its own PR.
